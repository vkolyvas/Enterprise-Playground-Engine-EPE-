contracts:
  # Entity directories (authoritative data)
  entities:
    schema: schemas/entity.schema.yaml
    dirs:
      ms: entities/ms
      task: entities/task
      rfp-req: entities/rfp-req
      del: entities/del
      aprv: entities/aprv
      stk: entities/stk

  # Derived governance views
  governance:
    schema: schemas/governance.schema.yaml
    paths:
      milestone-register: governance/milestone-register.md
      task-register: governance/task-register.md
      rfp-obligations: governance/rfp-obligations.md
      traceability-matrix: governance/traceability-matrix.md
      governance-control: governance/governance.md

  # Stage control documents (derived per stage)
  product:
    stage_control: product/product-control.md
  presales:
    stage_control: presales/presales-control.md
  architecture:
    stage_control: architecture/solution-manager-cockpit.md
  delivery:
    stage_control: delivery/delivery-control.md

  product:
    schema: schemas/product.schema.yaml
    paths:
      definition: product/definition.md
      catalog: product/catalog.md
      guardrails: product/guardrails.md
      readiness: product/readiness.md
  presales:
    schema: schemas/presales.schema.yaml
    paths:
      discovery: presales/discovery.md
      qualification: presales/qualification.md
      scope: presales/scope.md
      sow: presales/sow.md
      handover: presales/handover.md
  architecture:
    schema: schemas/architecture.schema.yaml
    paths:
      validation: architecture/validation.md
      hld: architecture/hld.md
      security: architecture/security.md
      lld: architecture/lld.md
      cost: architecture/cost.md
      blueprint: architecture/blueprint.md
  delivery:
    schema: schemas/delivery.schema.yaml
    paths:
      plan: delivery/plan.md
      test: delivery/test.md
      acceptance: delivery/acceptance.md
      onboarding: delivery/onboarding.md
      operations: delivery/operations.md
      handover: delivery/handover.md
      feedback: delivery/feedback.md
